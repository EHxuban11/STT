name: warm-cache

on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/warm-cache.yml'
      - 'index.html'
      - 'package-lock.json'
      - 'package.json'
      - 'src/**'
      - 'src-tauri/**'
      - 'tsconfig*.json'
      - 'vite.config.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warm-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warm-windows-release-cache:
    name: Warm Windows release cache
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: windows-release

      - name: Verify CMake
        shell: pwsh
        run: |
          if (Get-Command cmake -ErrorAction SilentlyContinue) {
            cmake --version
          } else {
            choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
            "C:\Program Files\CMake\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            cmake --version
          }

      - name: Install frontend deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Rust release binary
        run: cargo build --release --manifest-path src-tauri/Cargo.toml
