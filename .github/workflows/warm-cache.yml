name: warm-cache

on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/warm-cache.yml'
      - 'index.html'
      - 'package-lock.json'
      - 'package.json'
      - 'src/**'
      - 'src-tauri/**'
      - 'tsconfig*.json'
      - 'vite.config.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warm-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warm-release-cache:
    name: Warm ${{ matrix.name }} release cache
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'Windows x64', platform: windows-latest, args: '', cache: windows, target: x86_64-pc-windows-msvc }
          - { name: 'macOS Apple Silicon', platform: macos-latest, args: '--target aarch64-apple-darwin', cache: macos-arm64, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: release-${{ matrix.cache }}

      - name: Verify CMake on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Get-Command cmake -ErrorAction SilentlyContinue) {
            cmake --version
          } else {
            choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
            "C:\Program Files\CMake\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            cmake --version
          }

      - name: Verify CMake on macOS
        if: runner.os == 'macOS'
        run: cmake --version

      - name: Install frontend deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build installable app
        run: npx tauri build ${{ matrix.args }}
